<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Torob Agent workflow</title>
<desc id="desc">Text queries are routed to a default agent or a clarification agent. Image prompts use an image agent. Each path retrieves catalog data and returns a text answer, product keys, or seller keys. This is a simplified architecture diagram, not an application screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e8d66"/></marker></defs>
<rect width="1536" height="1024" fill="#f5f8f1"/>
<g font-family="Arial, sans-serif" fill="#172b23">
<text x="64" y="65" font-size="23" font-weight="600" fill="#526b54">TOROB AGENT</text>
<text x="64" y="122" font-size="44" font-weight="600" fill="#172b23">From a shopping question to a catalog answer</text>
<rect x="64" y="174" width="380" height="116" rx="18" fill="#e7efdf" stroke="#bdcdb8" stroke-width="2"/>
<text x="90" y="220" font-size="34" font-weight="600" fill="#172b23">Text query</text>
<text x="90" y="260" font-size="27" font-weight="400" fill="#526b54">Question or preference</text>
<path d="M 444 232 H 504" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="520" y="174" width="448" height="116" rx="18" fill="#e7efdf" stroke="#bdcdb8" stroke-width="2"/>
<text x="546" y="220" font-size="34" font-weight="600" fill="#172b23">Router + chat state</text>
<text x="546" y="260" font-size="27" font-weight="400" fill="#526b54">Choose the text agent</text>
<rect x="1032" y="174" width="440" height="116" rx="18" fill="#e7efdf" stroke="#bdcdb8" stroke-width="2"/>
<text x="1058" y="220" font-size="34" font-weight="600" fill="#172b23">Image prompt</text>
<text x="1058" y="260" font-size="27" font-weight="400" fill="#526b54">Photo + optional question</text>
<path d="M 664 290 V 326 H 274 V 365" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 760 290 V 365" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1252 290 V 365" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="382" width="420" height="185" rx="18" fill="#ffffff" stroke="#bdcdb8" stroke-width="2"/>
<text x="90" y="426" font-size="23" font-weight="600" fill="#3d6748">01</text>
<text x="90" y="474" font-size="32" font-weight="600" fill="#172b23">Default agent</text>
<text x="90" y="515" font-size="26" font-weight="400" fill="#526b54">Product lookup, features,</text>
<text x="90" y="548" font-size="26" font-weight="400" fill="#526b54">comparisons &amp; seller facts</text>
<path d="M 274 567 V 624" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="548" y="382" width="420" height="185" rx="18" fill="#ffffff" stroke="#bdcdb8" stroke-width="2"/>
<text x="574" y="426" font-size="23" font-weight="600" fill="#3d6748">02</text>
<text x="574" y="474" font-size="32" font-weight="600" fill="#172b23">Clarification agent</text>
<text x="574" y="515" font-size="26" font-weight="400" fill="#526b54">Ask follow-up questions;</text>
<text x="574" y="548" font-size="26" font-weight="400" fill="#526b54">narrow product &amp; seller needs</text>
<path d="M 758 567 V 624" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1032" y="382" width="440" height="185" rx="18" fill="#ffffff" stroke="#bdcdb8" stroke-width="2"/>
<text x="1058" y="426" font-size="23" font-weight="600" fill="#3d6748">03</text>
<text x="1058" y="474" font-size="32" font-weight="600" fill="#172b23">Image agent</text>
<text x="1058" y="515" font-size="26" font-weight="400" fill="#526b54">Find visual matches;</text>
<text x="1058" y="548" font-size="26" font-weight="400" fill="#526b54">reason about the image</text>
<path d="M 1242 567 V 624" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="640" width="1408" height="145" rx="18" fill="#e7efdf" stroke="#bdcdb8" stroke-width="2"/>
<text x="90" y="690" font-size="34" font-weight="600" fill="#172b23">Torob catalog  /  PostgreSQL + pgvector</text>
<text x="90" y="738" font-size="28" font-weight="400" fill="#526b54">Full-text &amp; fuzzy search</text>
<text x="570" y="738" font-size="28" font-weight="400" fill="#526b54">Vector similarity</text>
<text x="1010" y="738" font-size="28" font-weight="400" fill="#526b54">Products · offers · shops</text>
<path d="M 768 785 V 824" fill="none" stroke="#6e8d66" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="840" width="1408" height="112" rx="18" fill="#ffffff" stroke="#bdcdb8" stroke-width="2"/>
<text x="90" y="886" font-size="33" font-weight="600" fill="#172b23">Structured response</text>
<text x="90" y="927" font-size="28" font-weight="400" fill="#526b54">Text answer, product identifiers, or seller identifiers</text>
<text x="64" y="994" font-size="23" font-weight="400" fill="#526b54">Simplified architecture · Clarification can continue across multiple turns</text>
</g></svg>
