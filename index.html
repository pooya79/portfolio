    <title>Pouya Fallah | AI Product Engineer</title>
    <script>
      try {
        const preference = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (['', '#', '#/'].includes(location.hash)) {
        document.querySelectorAll('[data-scene-theme]').forEach(link => {
          link.media = link.dataset.sceneTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
      if (location.hash === '#/projects' || location.hash === '#/projects/') {
        document.querySelectorAll('[data-project-theme]').forEach(link => {
          link.media = link.dataset.projectTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
      if (location.hash === '#/projects/torob-agent' || location.hash === '#/projects/torob-agent/') {
        document.querySelectorAll('[data-torob-agent-theme]').forEach(link => {
          link.media = link.dataset.torobAgentTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
      if (location.hash === '#/projects/gitlab-agent' || location.hash === '#/projects/gitlab-agent/') {
        document.querySelectorAll('[data-gitlab-agent-theme]').forEach(link => {
          link.media = link.dataset.gitlabAgentTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
      if (location.hash === '#/about' || location.hash === '#/about/') {
        document.querySelectorAll('[data-about-theme]').forEach(link => {
          link.media = link.dataset.aboutTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
      if (location.hash === '#/contact' || location.hash === '#/contact/') {
        document.querySelectorAll('[data-contact-theme]').forEach(link => {
          link.media = link.dataset.contactTheme === document.documentElement.dataset.theme ? 'all' : 'not all';
        });
      }
    </script>
